name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator app
        run: xcodebuild -project OrderThisPOS.xcodeproj -scheme OrderThisPOS -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent 'build/Build/Products/Debug-iphonesimulator/OrderThis POS.app' OrderThisPOS-iOS-Simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OrderThisPOS-iOS-Simulator
          path: OrderThisPOS-iOS-Simulator.zip
